<!doctype html><html lang="en"><meta charset="utf-8"><title>ADV personal filter checks</title>
<body><h1>Personal filter fixture</h1><div id="adv-demo-ad">Fixture ad</div><div data-ad-slot="fixture">Built-in ad slot</div><div id="unwanted">Unwanted content</div><div id="keep">Keep this content</div>
<script>
Object.defineProperty(document, "hidden", {configurable:true, get:()=>false});
const handlers = [];
let saved = {};
let shared = false;
let remote = [];
let nativeFailure = false;
let dynamicRules = [{id:42, priority:1, action:{type:'allow'}, condition:{urlFilter:'unrelated'}}];
let failSourceUpdate = false;
let failSourceSave = false;
const clone = value => JSON.parse(JSON.stringify(value));
const toolbarIcons = new Map();
const toolbarTitles = new Map();
const tabEvents = {updated:[], activated:[], removed:[]};
let matchedRules = [];
let failMatchedRules = false;
window.browser = {
  action: {
    async setIcon({tabId,path}) { toolbarIcons.set(tabId,path); },
    async setTitle({tabId,title}) { toolbarTitles.set(tabId,title); }
  },
  storage: {local: {
    async get() { return clone(saved); },
    async set(value) {
      if (failSourceSave && 'globalBlockedSourcesV1' in value) { failSourceSave = false; throw new Error('Storage unavailable'); }
      Object.assign(saved, clone(value));
    }
  }},
  declarativeNetRequest: {
    async getDynamicRules() { return clone(dynamicRules); },
    async updateDynamicRules({removeRuleIds, addRules}) {
      if (failSourceUpdate) { failSourceUpdate = false; throw new Error('DNR unavailable'); }
      dynamicRules = [...dynamicRules.filter(rule=>!removeRuleIds.includes(rule.id)), ...clone(addRules)];
    },
    async getEnabledRulesets() { return ['advertising']; },
    async getMatchedRules() {
      if (failMatchedRules) throw new Error('activeTab permission not granted');
      return {rulesMatchedInfo:clone(matchedRules)};
    }
  },
  runtime: {
    getURL(path) { return 'safari-web-extension://adv/' + path; },
    onMessage: {addListener(handler) { handlers.push(handler); }},
    async sendNativeMessage(application, message) {
      if (nativeFailure) throw new Error("Native unavailable");
      if (!shared) return {shared:false, rules:[]};
      if (message.operation === "merge") {
        const merged = new Map(remote.map(rule=>[rule.id,rule]));
        for (const rule of message.rules) merged.set(rule.id,clone(rule));
        remote = [...merged.values()];
      }
      if (message.operation === 'replace') {
        const rule = remote.find(rule=>rule.id===message.id && !rule.deleted && rule.host===message.host);
        if (!rule || rule.modified!==message.expectedModified) return {error:'Rule changed'};
        remote=remote.map(item=>item.id===rule.id ? {...rule,selector:message.selector,modified:Math.max(Date.now(),rule.modified+1)} : item);
      }
      if (message.operation === 'remove') {
        const rule = remote.find(rule=>rule.id===message.id);
        if (rule) { rule.deleted=true; rule.modified=Math.max(Date.now(),rule.modified+1); }
      }
      return {shared:true, rules:clone(remote)};
    },
    async sendMessage(message) { return await handlers[0](message, {tab:{id:1,url:location.href},url:location.href}); }
  },
  tabs: {
    onUpdated: {addListener(handler) { tabEvents.updated.push(handler); }},
    onActivated: {addListener(handler) { tabEvents.activated.push(handler); }},
    onRemoved: {addListener(handler) { tabEvents.removed.push(handler); }},
    async query() { return [{id:1}]; },
    async sendMessage(id,message) { for (const handler of handlers.slice(1)) handler(message); }
  }
};
window.runADVToolbarTests = async function() {
  const results = [];

    {operation:'activity',blocked,document,started}, {tab:{id:2,url:location.href},frameId});
  await report(0,false);

  await report(1,true);
  check(toolbarIcons.get(2)==='toolbar.svg','Blocking in a subframe closes the toolbar lid');
  await report(0,false);
  check(toolbarIcons.get(2)==='toolbar.svg','An idle main frame does not override a blocking subframe');
  await report(1,false);
  check(toolbarIcons.get(2)==='toolbar-idle.svg','The lid opens when the last cosmetic block disappears');
  await report(0,false,'new',base+1);
  await report(0,true,'first',base);
  check(toolbarIcons.get(2)==='toolbar-idle.svg','Late activity from a previous document cannot overwrite the new page');
  matchedRules=[{tabId:2,timeStamp:base+100,rule:{ruleId:1,rulesetId:'advertising'}}];
  await handlers[0]({operation:'toolbarStatus',tabId:2},{});
  check(toolbarIcons.get(2)==='toolbar.svg','A confirmed DNR match closes the lid without a cosmetic match');
  tabEvents.updated.at(-1)(2,{status:'loading'});
  await report(0,false,'next',Date.now());
  check(toolbarIcons.get(2)==='toolbar-idle.svg','Navigation clears network activity from the previous page');
  failMatchedRules=true;
  await handlers[0]({operation:'toolbarStatus',tabId:3},{});
  check(toolbarTitles.get(3).includes('unavailable'),'Unavailable DNR feedback is reported as unknown rather than disabled');
  failMatchedRules=false;
  const originalNow=Date.now;
  try {
    await report(1,true,'frame',base+2);
    Date.now=()=>originalNow()+31000;
    await report(0,false,'next',base+10);
    check(toolbarIcons.get(2)==='toolbar-idle.svg','Expired subframe reports cannot leave the blocking icon stuck');
  } finally { Date.now=originalNow; }
  return JSON.stringify(results);
};

    ui.querySelector('#help-inspect').click();
    for(let i=0;i<100 && !ui.querySelector('#help-candidates li');i++) await new Promise(resolve=>setTimeout(resolve,20));
    const row=ui.querySelector('#help-candidates li');
    check(!!row && ui.querySelector('#help-status').textContent.includes('Model unavailable'),'Unavailable model still exposes deterministic candidates in the popup');
    const buttons=row.querySelectorAll('button');
    check(buttons.length===1 && buttons[0].textContent==='Select & preview','A proposal offers a single selection-and-preview action instead of a copy flow');
    buttons[0].click();
    for(let i=0;i<100 && buttons[0].disabled;i++) await new Promise(resolve=>setTimeout(resolve,20));
    check(ui.querySelector('#selectors').value==='#ad-123456789' && selectedPreview.count===1 && JSON.stringify(saved)===stateBefore,'Selecting a proposal stages and previews its condition without saving a rule');
    check(!ui.querySelector('#help-inspect').disabled && !ui.querySelector('#help-ask').disabled,'Help restores its controls after a completed inspection');
  } finally {
    browser.runtime.sendMessage=oldSend; browser.runtime.sendNativeMessage=oldNative; browser.scripting=oldScripting;
    globalThis.__advHelpPreview?.remove(); delete window.host;delete window.tab;delete globalThis.ADVDraft;
  }


  const brands=document.createElement('div');
  brands.innerHTML='<div class="ad-card"><a href="https://ad.fanza.example/banner?token=private"><img alt="FANZA banner"></a></div><div class="ad-card"><a href="https://ad.games.dmm.com/banner"><img alt="DMM Games"></a></div><a href="https://fanza.example/article">Article about FANZA</a>';
  document.body.append(brands);
  const brandScan=api.inspectDocument('discover','',[],'',['FANZA']);
  check(brandScan.candidates.length===1 && brandScan.candidates[0].count===1,'Brand discovery proposes a marked advertising container and deduplicates alternative evidence');
  check(!brandScan.candidates.some(candidate=>candidate.selector.includes('dmm')) && !brandScan.candidates[0].selector.includes('article'),'A narrow search respects its literal terms and skips ordinary text links');
  check(!JSON.stringify(brandScan).includes('private') && brandScan.candidates[0].reason.includes('URL host or path'),'Brand evidence strips resource query strings and states its actual source');
  const broadened=api.inspectDocument('discover','',[],'',['FANZA','DMM']);
  check(broadened.candidates.some(candidate=>candidate.selector.includes('dmm')) && broadened.candidates.filter(candidate=>candidate.reason.includes('Inside a marked advertising container.')).length===2,'Related-brand terms from the guide can broaden the visible draft to DMM Games');
  const absent=api.inspectDocument('discover','',[],'',['UnknownBrand']);
  check(absent.candidates.length===0,'Absent brand evidence produces no invented filter');
  brands.remove();
  const rule={id:crypto.randomUUID(),host:location.hostname,selector:'.before-edit',modified:Date.now(),deleted:false};
  remote.push(rule); saved.personalRulesV1=clone(remote);
  const updated=await handlers[0]({operation:'replace',id:rule.id,host:rule.host,selector:'.after-edit',expectedModified:rule.modified},{});
  const replaced=updated.rules.find(item=>item.id===rule.id);
  check(replaced.selector==='.after-edit' && replaced.modified>rule.modified && !replaced.deleted,'Explicit edits preserve rule identity and modification ordering');
  const stale=await handlers[0]({operation:'replace',id:rule.id,host:rule.host,selector:'.stale-edit',expectedModified:rule.modified},{});
  check(!!stale.error && remote.find(item=>item.id===rule.id).selector==='.after-edit','Stale edits cannot overwrite a newer saved condition');
  ui.remove();selection.remove();
  return JSON.stringify(results);
};

window.runADVWorkspaceControls = async function(helpScript,popupScript,popupHTML) {
  const results=[];
  function check(value,name) { if(!value)throw new Error(name); results.push(name); }
  async function waitFor(predicate) { for(let i=0;i<100;i++){if(predicate())return;await new Promise(resolve=>setTimeout(resolve,20));}throw new Error('Workspace controls did not settle'); }
  const ui=document.createElement('div');
  ui.innerHTML=new DOMParser().parseFromString(popupHTML,'text/html').body.innerHTML;
  const ads=document.createElement('div');
  ads.innerHTML='<div class="ad-card"><a href="https://ad.fanza.example/banner"><img alt="FANZA ad" width="30" height="30"></a></div><div class="ad-card"><a href="https://ad.games.dmm.com/banner"><img alt="DMM Games" width="30" height="30"></a></div>';
  document.body.append(ui,ads);
  const original={send:browser.runtime.sendMessage,native:browser.runtime.sendNativeMessage,scripting:browser.scripting,query:browser.tabs.query};
  browser.runtime.sendMessage=message=>handlers[0](message,{tab:{id:2},url:browser.runtime.getURL('popup.html')});
  browser.runtime.sendNativeMessage=async(application,message)=>message.operation==='assist'
    ? {modelStatus:'On-device guide available.',searchTerms:message.request.question.includes('FANZA') ? ['FANZA','DMM'] : [],explanation:'Review the proposed content.',findings:[],candidates:message.request.candidates,
        suggestedIndex:message.request.question==='Hide an ad on this page.' && message.request.phase!=='interpret' ? 0 : undefined}
    : original.native(application,message);
  browser.tabs.query=async()=>[{id:1,url:location.href}];
  browser.scripting={async executeScript({func,args}){return[{frameId:0,result:func(...args)}];}};
  try {
    (0,eval)(helpScript+'\n'+popupScript);
    await waitFor(()=>!ui.querySelector('#pick').disabled);
    const before=JSON.stringify(saved);
    const question=ui.querySelector('#help-question');question.value='Hide the FANZA ads on this page.';ui.querySelector('#help-ask').click();
    await waitFor(()=>!ui.querySelector('#help-ask').disabled);
    const editor=ui.querySelector('#selectors'), apply=ui.querySelector('#save-bulk'), preview=ui.querySelector('#preview-draft');
    check(editor.value.includes('fanza') && editor.value.includes('dmm'),'Natural-language intent stages requested and related brand conditions in the shared draft');
    check(apply.disabled && JSON.stringify(saved)===before,'Conversation alone cannot apply a staged draft');
    preview.click();await waitFor(()=>!preview.disabled);
    check(!apply.disabled,'A successful target preview enables explicit application');
    const proposed=editor.value;
    const candidate=ui.querySelector('#help-candidates li');
    candidate.querySelector('button').click();await waitFor(()=>!candidate.querySelector('button').disabled);
    check(editor.value===candidate.querySelector('code').textContent && !editor.value.includes('\n') && !apply.disabled && JSON.stringify(saved)===before,'Choosing a candidate replaces the draft, previews it, and enables Apply without copying or saving');
    editor.value=proposed;editor.dispatchEvent(new Event('input'));preview.click();await waitFor(()=>!preview.disabled);
    const execute=browser.scripting.executeScript;
    let release;
    browser.scripting.executeScript=async request=>{
      const result=await execute(request);
      await new Promise(resolve=>{release=resolve;});
      return result;
    };
    preview.click();await waitFor(()=>!!release);
    editor.value='.ad-card';editor.dispatchEvent(new Event('input'));
    release();await new Promise(resolve=>setTimeout(resolve,20));
    check(apply.disabled,'An old preview response cannot approve a draft edited while inspection was pending');
    browser.scripting.executeScript=execute;
    editor.value=proposed;editor.dispatchEvent(new Event('input'));preview.click();await waitFor(()=>!preview.disabled);
    release=undefined;
    browser.scripting.executeScript=async request=>{
      const result=await execute(request);
      await new Promise(resolve=>{release=resolve;});
      return result;
    };
    apply.click();await waitFor(()=>!!release);
    editor.value='.ad-card';editor.dispatchEvent(new Event('input'));
    release();await waitFor(()=>ui.querySelector('#bulk-status').textContent.includes('draft changed'));
    check(JSON.stringify(saved)===before,'Editing during the apply recheck cannot save an obsolete draft');
    browser.scripting.executeScript=execute;
    ui.querySelector('#clear-draft').click();
    question.value='Hide an ad on this page.';ui.querySelector('#help-ask').click();
    await waitFor(()=>!ui.querySelector('#help-ask').disabled);
    check(editor.value && apply.disabled && ui.querySelector('#help-status').textContent.includes('marked advertising containers') && JSON.stringify(saved)===before,'A brand-free request can stage a model-selected page candidate without choosing an element or saving');
    ui.querySelector('#clear-draft').click();
    question.value='What is this page about?';ui.querySelector('#help-ask').click();
    await waitFor(()=>!ui.querySelector('#help-ask').disabled);
    check(!editor.value && ui.querySelector('#help-candidates li') && !ui.querySelector('#help-status').textContent.includes('Name a brand'),'An unselected general request exposes candidates but does not stage them without a model choice');
    editor.value='body';editor.dispatchEvent(new Event('input'));
    check(apply.disabled,'Editing the draft invalidates its previous approval');
    preview.click();await waitFor(()=>!preview.disabled);
    check(apply.disabled && ui.querySelector('#bulk-status').textContent.includes('Whole-page'),'Whole-page proposals cannot be previewed or applied');
    editor.value=proposed;editor.dispatchEvent(new Event('input'));preview.click();await waitFor(()=>!preview.disabled);
    apply.click();await waitFor(()=>editor.value==='');
    check(proposed.split('\n').every(selector=>saved.personalRulesV1.some(rule=>!rule.deleted && rule.selector===selector)),'Only the explicit Apply draft action persists the proposed condition');
    check(ui.querySelector('#rules').textContent.includes('DMM'),'Related-brand conditions remain visible and individually removable in the saved list');
  } finally {
    browser.runtime.sendMessage=original.send;browser.runtime.sendNativeMessage=original.native;browser.scripting=original.scripting;browser.tabs.query=original.query;
    globalThis.__advHelpPreview?.remove();delete globalThis.ADVDraft;
    ui.remove();ads.remove();
  }
  return JSON.stringify(results);
};
